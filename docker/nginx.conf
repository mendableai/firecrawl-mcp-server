events {}
http {
  upstream app { server 127.0.0.1:3000; }
  upstream app_search { server 127.0.0.1:3001; }
  gzip off;

  server {
    listen 8080;

    # Path-scoped protected-resource metadata for the search surface. An exact
    # `=` match outranks the ^~ /.well-known/ prefix below, so the origin-level
    # document still routes to the full instance.
    location = /.well-known/oauth-protected-resource/v2/mcp-search {
      proxy_buffering off;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://__MCP_SEARCH_UPSTREAM__;
    }

    # OAuth discovery documents (RFC 8414 / RFC 9728) must reach the app with the
    # URI intact. `^~` makes this prefix win over the legacy /{apiKey}/{rest} regex
    # below, which would otherwise treat ".well-known" as an API key and rewrite the
    # path to /oauth-protected-resource (404). This is what the 401 challenge's
    # `resource_metadata` URL points at, so it MUST resolve.
    location ^~ /.well-known/ {
      proxy_buffering off;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app;
    }

    # Primary hosted Streamable HTTP identities. Each deployment configures the
    # app for exactly one endpoint; ingress sends the matching public path here.
    location ~ ^/v2/mcp-oauth/?$ {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_set_header Connection "";
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Firecrawl-Key-Transport "";
      proxy_pass http://app;
    }

    location ~ ^/v2/mcp/?$ {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_set_header Connection "";
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Only the dedicated legacy route below may set this internal marker.
      proxy_set_header X-Firecrawl-Key-Transport "";
      proxy_pass http://app;
    }

    # Legacy aliases belong to the full /v2/mcp identity only. Ingress must
    # route them to the full deployment; an account-pod misroute intentionally
    # 404s rather than silently changing the OAuth resource to /v2/mcp-oauth.
    location = /mcp {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_set_header Connection "";
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Do not accept a client-supplied legacy-path marker on the alias.
      proxy_set_header X-Firecrawl-Key-Transport "";
      rewrite ^ /v2/mcp break;
      proxy_pass http://app;
    }

    # Search surface, header-based: exactly /v2/mcp-search (or a subpath). It is
    # served by the in-process companion on full pods and by the primary app on
    # a dedicated search pod. The (?:/|$) boundary keeps it from
    # swallowing unrelated paths like /v2/mcp-searchXYZ. Placed before the
    # generic /v(1|2)/(.*) regex so it wins (first matching regex wins). Proxied
    # verbatim because the instance serves the /v2/mcp-search path directly.
    location ~ ^/v2/mcp-search(?:/|$) {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_set_header Connection "";
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Firecrawl-Key-Transport "";
      proxy_pass http://__MCP_SEARCH_UPSTREAM__;
    }

    # Search surface, key-in-path: /{apiKey}/v2/mcp-search. This form cannot
    # authenticate an OAuth-only resource. Return a terminal migration response
    # rather than forwarding to the companion (which is retired after cutover).
    # Keep access logging disabled because the URI contains a credential.
    # Must precede the legacy /{apiKey}/v(1|2)/(.*) regex below.
    location ~ ^/(?<apikey>[^/]+)/v2/mcp-search(?:/|$) {
      access_log off;
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      return 410 '{"error":"gone","message":"Key-in-path access to /v2/mcp-search has been removed. Use the OAuth-only Firecrawl search MCP resource.","migration_url":"https://docs.firecrawl.dev/mcp-server"}';
    }

    # Deprecated key-in-path MCP compatibility for the full identity. Never log
    # the request URI: it contains the credential. Move the key into a header
    # and use the canonical keyless endpoint path internally.
    location ~ ^/(?<apikey>[^/]+)/(?:v2/mcp|mcp)/?$ {
      access_log off;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_set_header Connection "";
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header X-Firecrawl-API-Key $apikey;
      proxy_set_header X-Firecrawl-Key-Transport path;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^ /v2/mcp break;
      proxy_pass http://app;
    }

    # Header-based with version: /v1|v2/{rest} (MUST COME BEFORE LEGACY)
    location ~ ^/v(?:1|2)/(.*)$ {
      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^/v(?:1|2)/(.*)$ /$1 break;
      proxy_pass http://app;
    }

    # Legacy with API key and version: /{apiKey}/v1|v2/{rest}
    location ~ ^/(?<apikey>[^/]+)/v(?:1|2)/(.*)$ {
      access_log off;
      proxy_set_header X-Firecrawl-API-Key $apikey;
      proxy_set_header Host $host;

      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;

      rewrite ^/[^/]+/v(?:1|2)/(.*)$ /$1 break;
      proxy_pass http://app;
    }

    # Legacy: /{apiKey}/{rest}
    location ~ ^/(?<apikey>[^/]+)/(.*)$ {
      access_log off;
      proxy_set_header X-Firecrawl-API-Key $apikey;
      proxy_set_header Host $host;

      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;

      rewrite ^/[^/]+/(.*)$ /$1 break;
      proxy_pass http://app;
    }

    # Direct header-based paths
    location /mcp {
      proxy_buffering off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_pass http://app/mcp;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Firecrawl-Key-Transport "";
    }

    location /messages {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Firecrawl-Key-Transport "";
      proxy_pass http://app/messages;
    }

    location /sse {
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      chunked_transfer_encoding off;
      proxy_read_timeout 620s;
      proxy_send_timeout 620s;
      proxy_set_header Connection "";
      proxy_set_header Accept "text/event-stream";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Firecrawl-Key-Transport "";
      proxy_pass http://app/sse;
    }

    location /health {
      proxy_buffering off;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app/health;
    }

    # Never let the catch-all documentation redirect satisfy a Kubernetes
    # readiness probe. This route reaches the Node application's profile-aware
    # readiness check directly through nginx.
    location = /ready {
      proxy_buffering off;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://app/ready;
    }

    location / {
      return 301 https://docs.firecrawl.dev/mcp-server;
    }
  }
}
